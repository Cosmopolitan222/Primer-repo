{% extends "base.html" %}
{% block title %}{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}{% endblock %}
{% block content %}
<div class="topbar">
  <h1>{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}</h1>
</div>
<div class="card" style="max-width:640px;">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre / razón social *</label>
        <input type="text" name="nombre" required value="{{ cliente.nombre if cliente else '' }}">
      </div>
      <div class="form-group">
        <label>CIF/NIF</label>
        <input type="text" name="cif" value="{{ cliente.cif if cliente else '' }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ cliente.email if cliente else '' }}">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ cliente.telefono if cliente else '' }}">
      </div>
      <div class="form-group">
        <label>Persona de contacto</label>
        <input type="text" name="persona_contacto" value="{{ cliente.persona_contacto if cliente else '' }}">
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" name="direccion" value="{{ cliente.direccion if cliente else '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Notas internas</label>
      <textarea name="notas" rows="3">{{ cliente.notas if cliente else '' }}</textarea>
    </div>
    <button class="btn accent" type="submit">Guardar</button>
    <a href="{{ url_for('clientes') }}" class="btn secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
