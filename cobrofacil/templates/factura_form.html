{% extends "base.html" %}
{% block title %}Nueva factura{% endblock %}
{% block content %}
<div class="topbar"><h1>Nueva factura</h1></div>
<div class="card" style="max-width:640px;">
  <form method="post">
    <div class="form-group">
      <label>Cliente *</label>
      <select name="cliente_id" required>
        <option value="">Selecciona un cliente</option>
        {% for c in clientes %}
        <option value="{{ c.id }}" {{ 'selected' if cliente_preseleccionado == c.id }}>{{ c.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Número de factura *</label>
        <input type="text" name="numero" required placeholder="F-2025-0001">
      </div>
      <div class="form-group">
        <label>IVA %</label>
        <input type="number" step="0.01" name="iva_pct" value="21">
      </div>
      <div class="form-group">
        <label>Fecha de emisión *</label>
        <input type="date" name="fecha_emision" required>
      </div>
      <div class="form-group">
        <label>Fecha de vencimiento *</label>
        <input type="date" name="fecha_vencimiento" required>
      </div>
      <div class="form-group">
        <label>Base imponible (€) *</label>
        <input type="number" step="0.01" name="base_imponible" required>
      </div>
    </div>
    <button class="btn accent" type="submit">Guardar factura</button>
    <a href="{{ url_for('facturas') }}" class="btn secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
